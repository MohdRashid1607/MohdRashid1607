<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Muhammad Abdul Rashid</title>
  <desc id="hero-desc">AI/ML Engineer, Full-Stack Developer and Creative Technologist. Animated burgundy banner with orbital geometry and a drawing path.</desc>

  <defs>
    <linearGradient id="hero-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10070C"/>
      <stop offset="0.55" stop-color="#190B12"/>
      <stop offset="1" stop-color="#451126"/>
    </linearGradient>

    <radialGradient id="hero-glow-a" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#701A3D" stop-opacity="0.80"/>
      <stop offset="1" stop-color="#701A3D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hero-glow-b" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#C77B9B" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#C77B9B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hero-glow-c" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#451126" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#451126" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="hero-stroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#701A3D"/>
      <stop offset="0.55" stop-color="#C77B9B"/>
      <stop offset="1" stop-color="#F8F0F3"/>
    </linearGradient>

    <linearGradient id="hero-underline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#701A3D"/>
      <stop offset="0.5" stop-color="#E5B5C7"/>
      <stop offset="1" stop-color="#701A3D" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="hero-name-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8F0F3"/>
      <stop offset="1" stop-color="#E5B5C7"/>
    </linearGradient>

    <linearGradient id="hero-sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F8F0F3" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#F8F0F3" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#F8F0F3" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="hero-fade" cx="0.62" cy="0.5" r="0.75">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#000"/>
    </radialGradient>
    <mask id="hero-grid-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="1200" height="420">
      <rect width="1200" height="420" fill="url(#hero-fade)"/>
    </mask>

    <pattern id="hero-grid" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M20 0V100M40 0V100M60 0V100M80 0V100M0 20H100M0 40H100M0 60H100M0 80H100" stroke="#C77B9B" stroke-opacity="0.07" stroke-width="1" fill="none"/>
      <path d="M0 0H100M0 0V100" stroke="#C77B9B" stroke-opacity="0.18" stroke-width="1" fill="none"/>
    </pattern>

    <filter id="hero-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="hero-blur"/>
      <feMerge>
        <feMergeNode in="hero-blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="hero-bloom" x="-50%" y="-500%" width="200%" height="1100%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>

    <clipPath id="hero-clip"><rect width="1200" height="420" rx="22"/></clipPath>
    <clipPath id="hero-underline-clip"><rect x="80" y="219" width="480" height="8" rx="4"/></clipPath>
  </defs>

  <style>
    .hero-name { font-family: Georgia, 'Times New Roman', 'Liberation Serif', serif; font-size: 62px; font-weight: 700; letter-spacing: 0.5px; fill: url(#hero-name-fill); }
    .hero-role { font-family: 'Segoe UI', Helvetica, Arial, 'Liberation Sans', sans-serif; font-size: 21px; font-weight: 500; letter-spacing: 0.8px; fill: #E5B5C7; }
    .hero-sep  { fill: #C77B9B; }
    .hero-edu  { font-family: Georgia, 'Times New Roman', 'Liberation Serif', serif; font-size: 16px; font-style: italic; letter-spacing: 0.6px; fill: #C77B9B; }

    .hero-drift-a { animation: hero-drift-a 15s ease-in-out infinite alternate; }
    .hero-drift-b { animation: hero-drift-b 19s ease-in-out infinite alternate; }
    .hero-drift-c { animation: hero-drift-c 23s ease-in-out infinite alternate; }
    @keyframes hero-drift-a { from { transform: translate(0, 0); }      to { transform: translate(260px, 50px); } }
    @keyframes hero-drift-b { from { transform: translate(0, 0); }      to { transform: translate(-220px, -70px); } }
    @keyframes hero-drift-c { from { transform: translate(0, 0); }      to { transform: translate(180px, -60px); } }

    .hero-grid-move { animation: hero-grid-move 24s linear infinite; }
    @keyframes hero-grid-move { from { transform: translateX(0); } to { transform: translateX(100px); } }

    .hero-spin-a { transform-origin: 960px 210px; animation: hero-spin 34s linear infinite; }
    .hero-spin-b { transform-origin: 960px 210px; animation: hero-spin 46s linear infinite reverse; }
    .hero-spin-c { transform-origin: 960px 210px; animation: hero-spin 62s linear infinite; }
    .hero-spin-d { transform-origin: 960px 210px; animation: hero-spin 120s linear infinite reverse; }
    @keyframes hero-spin { to { transform: rotate(360deg); } }

    .hero-draw { stroke-dasharray: 1; stroke-dashoffset: 0; animation: hero-draw 11s ease-in-out infinite; }
    @keyframes hero-draw {
      0%   { stroke-dashoffset: 1; opacity: 1; }
      48%  { stroke-dashoffset: 0; opacity: 1; }
      86%  { stroke-dashoffset: 0; opacity: 1; }
      100% { stroke-dashoffset: 0; opacity: 0; }
    }

    .hero-pulse { animation: hero-pulse 3.4s ease-in-out infinite; }
    @keyframes hero-pulse { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }

    .hero-sweep { animation: hero-sweep 5.5s ease-in-out infinite; }
    @keyframes hero-sweep { from { transform: translateX(-220px); } to { transform: translateX(640px); } }

    .hero-twinkle { animation: hero-twinkle 4s ease-in-out infinite; }
    @keyframes hero-twinkle { 0%, 100% { opacity: 0.15; } 50% { opacity: 0.9; } }

    .hero-rise { animation: hero-rise 1.3s cubic-bezier(0.2, 0.7, 0.2, 1) both; }
    @keyframes hero-rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>

  <g clip-path="url(#hero-clip)">
    <!-- base -->
    <rect width="1200" height="420" fill="url(#hero-bg)"/>

    <!-- moving gradient light -->
    <circle class="hero-drift-a" cx="170" cy="90" r="320" fill="url(#hero-glow-a)"/>
    <circle class="hero-drift-b" cx="1000" cy="360" r="360" fill="url(#hero-glow-b)"/>
    <circle class="hero-drift-c" cx="520" cy="430" r="300" fill="url(#hero-glow-c)"/>

    <!-- fine technical grid -->
    <g mask="url(#hero-grid-mask)">
      <rect class="hero-grid-move" x="-100" y="0" width="1400" height="420" fill="url(#hero-grid)"/>
    </g>

    <!-- stars -->
    <g fill="#F8F0F3">
      <circle class="hero-twinkle" cx="118" cy="52" r="1.4" style="animation-delay:0s"/>
      <circle class="hero-twinkle" cx="342" cy="34" r="1" style="animation-delay:1.2s"/>
      <circle class="hero-twinkle" cx="486" cy="78" r="1.6" style="animation-delay:2.1s"/>
      <circle class="hero-twinkle" cx="640" cy="40" r="1.1" style="animation-delay:0.6s"/>
      <circle class="hero-twinkle" cx="744" cy="96" r="1.3" style="animation-delay:3s"/>
      <circle class="hero-twinkle" cx="1088" cy="64" r="1.5" style="animation-delay:1.7s"/>
      <circle class="hero-twinkle" cx="1150" cy="150" r="1" style="animation-delay:2.6s"/>
      <circle class="hero-twinkle" cx="1120" cy="300" r="1.4" style="animation-delay:0.3s"/>
      <circle class="hero-twinkle" cx="820" cy="372" r="1.2" style="animation-delay:3.4s"/>
      <circle class="hero-twinkle" cx="590" cy="388" r="1" style="animation-delay:1.9s"/>
      <circle class="hero-twinkle" cx="60" cy="380" r="1.5" style="animation-delay:2.8s"/>
      <circle class="hero-twinkle" cx="260" cy="396" r="1.1" style="animation-delay:0.9s"/>
    </g>

    <!-- orbital geometry -->
    <g fill="none">
      <g class="hero-spin-d">
        <circle cx="960" cy="210" r="232" stroke="#701A3D" stroke-opacity="0.9" stroke-width="1.2" stroke-dasharray="3 15"/>
      </g>
      <g class="hero-spin-a">
        <circle cx="960" cy="210" r="112" stroke="#E5B5C7" stroke-opacity="0.45" stroke-width="1.4" stroke-dasharray="1 9" stroke-linecap="round"/>
      </g>
      <g class="hero-spin-b">
        <g transform="rotate(-24 960 210)">
          <ellipse cx="960" cy="210" rx="196" ry="64" stroke="#C77B9B" stroke-opacity="0.55" stroke-width="1.3"/>
          <circle cx="1156" cy="210" r="6" fill="#E5B5C7" filter="url(#hero-glow)"/>
        </g>
      </g>
      <g class="hero-spin-c">
        <g transform="rotate(26 960 210)">
          <ellipse cx="960" cy="210" rx="196" ry="64" stroke="#C77B9B" stroke-opacity="0.32" stroke-width="1.3"/>
          <circle cx="764" cy="210" r="4" fill="#C77B9B" filter="url(#hero-glow)"/>
        </g>
      </g>
      <circle cx="960" cy="210" r="42" stroke="#C77B9B" stroke-opacity="0.35" stroke-width="1.2"/>
      <circle class="hero-pulse" cx="960" cy="210" r="22" fill="#701A3D" fill-opacity="0.7"/>
      <circle cx="960" cy="210" r="6" fill="#F8F0F3" filter="url(#hero-glow)"/>
    </g>

    <!-- animated signal path -->
    <path d="M-20 372 C 170 332, 300 404, 480 368 S 800 332, 954 214" fill="none" stroke="#C77B9B" stroke-opacity="0.16" stroke-width="2"/>
    <path class="hero-draw" pathLength="1" d="M-20 372 C 170 332, 300 404, 480 368 S 800 332, 954 214" fill="none" stroke="url(#hero-stroke)" stroke-width="3.5" stroke-linecap="round" filter="url(#hero-glow)"/>

    <!-- text -->
    <text class="hero-name hero-rise" x="80" y="200" style="animation-delay:0.15s">Muhammad Abdul Rashid</text>

    <!-- glowing underline -->
    <g class="hero-rise" style="animation-delay:0.55s">
      <rect class="hero-pulse" x="80" y="219" width="480" height="8" rx="4" fill="#C77B9B" filter="url(#hero-bloom)"/>
      <rect x="80" y="221" width="480" height="3" rx="1.5" fill="url(#hero-underline)"/>
      <g clip-path="url(#hero-underline-clip)">
        <rect class="hero-sweep" x="80" y="219" width="160" height="8" fill="url(#hero-sweep)"/>
      </g>
    </g>

    <g class="hero-rise" style="animation-delay:0.9s">
      <text class="hero-role" x="80" y="272">AI/ML Engineer<tspan class="hero-sep" dx="14">|</tspan><tspan dx="14">Full-Stack Developer</tspan><tspan class="hero-sep" dx="14">|</tspan><tspan dx="14">Creative Technologist</tspan></text>
    </g>
    <g class="hero-rise" style="animation-delay:1.2s">
      <text class="hero-edu" x="80" y="318">BSc (Hons) Creative Computing, First-Class Honours</text>
    </g>

    <!-- frame -->
    <rect x="1" y="1" width="1198" height="418" rx="21" fill="none" stroke="#701A3D" stroke-opacity="0.7" stroke-width="1.5"/>
  </g>
</svg>
