<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280" role="img" aria-label="Muhammad Rashid — Full-Stack Developer">
  <title>Muhammad Rashid — Full-Stack Developer · Creative Technologist</title>

  <defs>
    <!-- Background gradient: midnight black to deep crimson -->
    <radialGradient id="mr-bg-radial" cx="72%" cy="30%" r="65%" fx="72%" fy="30%">
      <stop offset="0%"   stop-color="#350A12" stop-opacity="1"/>
      <stop offset="45%"  stop-color="#1A0508" stop-opacity="1"/>
      <stop offset="100%" stop-color="#08090C" stop-opacity="1"/>
    </radialGradient>

    <!-- Ember orb glow -->
    <radialGradient id="mr-orb" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#FF5A1F" stop-opacity="0.55"/>
      <stop offset="50%"  stop-color="#C5222A" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#08090C" stop-opacity="0"/>
    </radialGradient>

    <!-- Name text gradient: crimson to ember amber -->
    <linearGradient id="mr-name-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#FF9B54"/>
      <stop offset="40%"  stop-color="#FF5A1F"/>
      <stop offset="100%" stop-color="#C5222A"/>
    </linearGradient>

    <!-- Tagline text gradient -->
    <linearGradient id="mr-tag-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#F5EDE8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FF9B54" stop-opacity="0.70"/>
    </linearGradient>

    <!-- Underline glow gradient -->
    <linearGradient id="mr-underline-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#FF5A1F" stop-opacity="0"/>
      <stop offset="20%"  stop-color="#FF5A1F" stop-opacity="1"/>
      <stop offset="80%"  stop-color="#FF9B54" stop-opacity="1"/>
      <stop offset="100%" stop-color="#FF9B54" stop-opacity="0"/>
    </linearGradient>

    <!-- Grid mask: fade edges -->
    <linearGradient id="mr-grid-fade-h" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="white" stop-opacity="0"/>
      <stop offset="15%"  stop-color="white" stop-opacity="1"/>
      <stop offset="85%"  stop-color="white" stop-opacity="1"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="mr-grid-fade-v" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="white" stop-opacity="0"/>
      <stop offset="20%"  stop-color="white" stop-opacity="1"/>
      <stop offset="100%" stop-color="white" stop-opacity="1"/>
    </linearGradient>
    <mask id="mr-grid-mask">
      <rect width="900" height="280" fill="url(#mr-grid-fade-h)"/>
    </mask>

    <!-- Glow filter for name -->
    <filter id="mr-glow-name" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft glow for orb -->
    <filter id="mr-glow-orb" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Underline glow filter -->
    <filter id="mr-glow-line" x="-5%" y="-200%" width="110%" height="500%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Circuit path clip -->
    <clipPath id="mr-content-clip">
      <rect x="0" y="0" width="900" height="280" rx="12"/>
    </clipPath>
  </defs>

  <!-- Root clip for rounded corners -->
  <g clip-path="url(#mr-content-clip)">

    <!-- ── BACKGROUND ── -->
    <rect width="900" height="280" fill="url(#mr-bg-radial)"/>

    <!-- ── TECHNICAL GRID ── -->
    <g mask="url(#mr-grid-mask)" opacity="0.07">
      <!-- Vertical lines every 40px -->
      <line x1="40"  y1="0" x2="40"  y2="280" stroke="#C5222A" stroke-width="0.5"/>
      <line x1="80"  y1="0" x2="80"  y2="280" stroke="#C5222A" stroke-width="0.5"/>
      <line x1="120" y1="0" x2="120" y2="280" stroke="#C5222A" stroke-width="0.5"/>
      <line x1="160" y1="0" x2="160" y2="280" stroke="#C5222A" stroke-width="0.5"/>
      <line x1="200" y1="0" x2="200" y2="280" stroke="#C5222A" stroke-width="0.5"/>
      <line x1="240" y1="0" x2="240" y2="280" stroke="#C5222A" stroke-width="0.5"/>
      <line x1="280" y1="0" x2="280" y2="280" stroke="#C5222A" stroke-width="0.5"/>
      <line x1="320" y1="0" x2="320" y2="280" stroke="#C5222A" stroke-width="0.5"/>
      <line x1="360" y1="0" x2="360" y2="280" stroke="#C5222A" stroke-width="0.5"/>
      <line x1="400" y1="0" x2="400" y2="280" stroke="#C5222A" stroke-width="0.5"/>
      <line x1="440" y1="0" x2="440" y2="280" stroke="#C5222A" stroke-width="0.5"/>
      <line x1="480" y1="0" x2="480" y2="280" stroke="#C5222A" stroke-width="0.5"/>
      <line x1="520" y1="0" x2="520" y2="280" stroke="#C5222A" stroke-width="0.5"/>
      <line x1="560" y1="0" x2="560" y2="280" stroke="#C5222A" stroke-width="0.5"/>
      <line x1="600" y1="0" x2="600" y2="280" stroke="#C5222A" stroke-width="0.5"/>
      <line x1="640" y1="0" x2="640" y2="280" stroke="#C5222A" stroke-width="0.5"/>
      <line x1="680" y1="0" x2="680" y2="280" stroke="#C5222A" stroke-width="0.5"/>
      <line x1="720" y1="0" x2="720" y2="280" stroke="#C5222A" stroke-width="0.5"/>
      <line x1="760" y1="0" x2="760" y2="280" stroke="#C5222A" stroke-width="0.5"/>
      <line x1="800" y1="0" x2="800" y2="280" stroke="#C5222A" stroke-width="0.5"/>
      <line x1="840" y1="0" x2="840" y2="280" stroke="#C5222A" stroke-width="0.5"/>
      <line x1="880" y1="0" x2="880" y2="280" stroke="#C5222A" stroke-width="0.5"/>
      <!-- Horizontal lines every 40px -->
      <line x1="0" y1="40"  x2="900" y2="40"  stroke="#C5222A" stroke-width="0.5"/>
      <line x1="0" y1="80"  x2="900" y2="80"  stroke="#C5222A" stroke-width="0.5"/>
      <line x1="0" y1="120" x2="900" y2="120" stroke="#C5222A" stroke-width="0.5"/>
      <line x1="0" y1="160" x2="900" y2="160" stroke="#C5222A" stroke-width="0.5"/>
      <line x1="0" y1="200" x2="900" y2="200" stroke="#C5222A" stroke-width="0.5"/>
      <line x1="0" y1="240" x2="900" y2="240" stroke="#C5222A" stroke-width="0.5"/>
    </g>

    <!-- ── EMBER ORB (top-right glow) ── -->
    <ellipse cx="780" cy="60" rx="200" ry="160" fill="url(#mr-orb)" filter="url(#mr-glow-orb)">
      <animate attributeName="rx" values="200;220;200" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="160;180;160" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.75;1" dur="5s" repeatCount="indefinite"/>
    </ellipse>

    <!-- ── CIRCUIT TRACES — bottom edge ── -->
    <!-- Animated path trace along the bottom -->
    <path d="M0,260 H120 V240 H200 V260 H340 V245 H440 V260 H580 V240 H680 V255 H800 V240 H900"
          fill="none" stroke="#650D19" stroke-width="1.5" opacity="0.55"
          stroke-dasharray="1200" stroke-dashoffset="1200">
      <animate attributeName="stroke-dashoffset" values="1200;0" dur="3.5s" begin="0.3s" fill="freeze" repeatCount="1"/>
    </path>
    <!-- Secondary trace — orange accent dot runners -->
    <path d="M0,262 H100 V248 H220 V262 H380 V248 H500 V262 H650 V248 H760 V258 H900"
          fill="none" stroke="#FF5A1F" stroke-width="0.8" opacity="0.35"
          stroke-dasharray="1300" stroke-dashoffset="1300">
      <animate attributeName="stroke-dashoffset" values="1300;0" dur="4s" begin="0.8s" fill="freeze" repeatCount="1"/>
    </path>

    <!-- Circuit node dots (crosshair intersections) -->
    <g fill="#FF5A1F" opacity="0.5">
      <circle cx="120" cy="260" r="2.5"/>
      <circle cx="200" cy="240" r="2.5"/>
      <circle cx="340" cy="260" r="2.5"/>
      <circle cx="440" cy="245" r="2.5"/>
      <circle cx="580" cy="260" r="2.5"/>
      <circle cx="680" cy="240" r="2.5"/>
      <circle cx="800" cy="240" r="2.5"/>
    </g>

    <!-- ── DECORATIVE GEOMETRIC RING (right side) ── -->
    <circle cx="820" cy="140" r="80" fill="none" stroke="#C5222A" stroke-width="0.6" opacity="0.15">
      <animateTransform attributeName="transform" type="rotate" from="0 820 140" to="360 820 140" dur="30s" repeatCount="indefinite"/>
    </circle>
    <circle cx="820" cy="140" r="55" fill="none" stroke="#FF5A1F" stroke-width="0.4" opacity="0.12">
      <animateTransform attributeName="transform" type="rotate" from="360 820 140" to="0 820 140" dur="20s" repeatCount="indefinite"/>
    </circle>
    <!-- Orbital dot on outer ring -->
    <circle cx="900" cy="140" r="3" fill="#FF5A1F" opacity="0.5">
      <animateMotion dur="30s" repeatCount="indefinite">
        <mpath href="#mr-orbit-path"/>
      </animateMotion>
    </circle>
    <path id="mr-orbit-path" d="M820,60 A80,80 0 1,1 819.99,60" fill="none"/>

    <!-- ── MAIN TEXT CONTENT ── -->

    <!-- Greeting label -->
    <text x="62" y="82"
          font-family="'Segoe UI', 'Inter', 'Arial', sans-serif"
          font-size="11" font-weight="400" letter-spacing="3.5"
          fill="#FF5A1F" opacity="0.75" text-anchor="start">
      PORTFOLIO · GITHUB PROFILE
      <animate attributeName="opacity" values="0;0.75" dur="0.8s" begin="0.1s" fill="freeze"/>
    </text>

    <!-- Name — primary headline -->
    <text x="60" y="148"
          font-family="'Segoe UI', 'Inter', 'Arial Black', sans-serif"
          font-size="56" font-weight="800" letter-spacing="-1"
          fill="url(#mr-name-grad)" filter="url(#mr-glow-name)"
          text-anchor="start">
      Muhammad Rashid
      <animate attributeName="opacity" values="0;1" dur="1s" begin="0.3s" fill="freeze"/>
    </text>

    <!-- Glowing underline beneath name -->
    <rect x="60" y="158" height="2.5" rx="1.25" fill="url(#mr-underline-grad)" filter="url(#mr-glow-line)">
      <animate attributeName="width" values="0;540" dur="1.2s" begin="0.9s" fill="freeze"/>
    </rect>

    <!-- Tagline -->
    <text x="62" y="187"
          font-family="'Segoe UI', 'Inter', 'Arial', sans-serif"
          font-size="14" font-weight="400" letter-spacing="0.5"
          fill="url(#mr-tag-grad)" text-anchor="start">
      Full-Stack Developer · Creative Technologist
      <animate attributeName="opacity" values="0;1" dur="0.9s" begin="1.1s" fill="freeze"/>
    </text>

    <!-- Secondary line -->
    <text x="62" y="207"
          font-family="'Segoe UI', 'Inter', 'Arial', sans-serif"
          font-size="12" font-weight="300" letter-spacing="0.8"
          fill="#FF9B54" opacity="0.65" text-anchor="start">
      AI / ML  ·  Digital Marketing  ·  BSc Creative Computing — First Class Honours
      <animate attributeName="opacity" values="0;0.65" dur="0.9s" begin="1.4s" fill="freeze"/>
    </text>

    <!-- Pill tags row -->
    <g>
      <!-- Python pill -->
      <rect x="62" y="222" width="58" height="18" rx="9" fill="#350A12" stroke="#C5222A" stroke-width="0.8" opacity="0.9"/>
      <text x="91" y="234.5" font-family="'Segoe UI','Arial',sans-serif" font-size="9.5" fill="#FF9B54" text-anchor="middle" font-weight="500">Python</text>
      <!-- React pill -->
      <rect x="126" y="222" width="52" height="18" rx="9" fill="#350A12" stroke="#C5222A" stroke-width="0.8" opacity="0.9"/>
      <text x="152" y="234.5" font-family="'Segoe UI','Arial',sans-serif" font-size="9.5" fill="#FF9B54" text-anchor="middle" font-weight="500">React</text>
      <!-- Node.js pill -->
      <rect x="184" y="222" width="60" height="18" rx="9" fill="#350A12" stroke="#C5222A" stroke-width="0.8" opacity="0.9"/>
      <text x="214" y="234.5" font-family="'Segoe UI','Arial',sans-serif" font-size="9.5" fill="#FF9B54" text-anchor="middle" font-weight="500">Node.js</text>
      <!-- ML / AI pill -->
      <rect x="250" y="222" width="46" height="18" rx="9" fill="#350A12" stroke="#C5222A" stroke-width="0.8" opacity="0.9"/>
      <text x="273" y="234.5" font-family="'Segoe UI','Arial',sans-serif" font-size="9.5" fill="#FF9B54" text-anchor="middle" font-weight="500">ML/AI</text>
      <!-- Arduino pill -->
      <rect x="302" y="222" width="58" height="18" rx="9" fill="#350A12" stroke="#C5222A" stroke-width="0.8" opacity="0.9"/>
      <text x="331" y="234.5" font-family="'Segoe UI','Arial',sans-serif" font-size="9.5" fill="#FF9B54" text-anchor="middle" font-weight="500">Arduino</text>
    </g>

    <!-- Top-left crimson bar accent -->
    <rect x="0" y="0" width="4" height="280" fill="#C5222A" opacity="0.7"/>

    <!-- Bottom ember accent line -->
    <rect x="0" y="276" width="900" height="4" fill="#FF5A1F" opacity="0.45"/>

  </g>
</svg>
