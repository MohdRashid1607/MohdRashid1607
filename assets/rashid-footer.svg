<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 80" width="900" height="80" role="img" aria-label="footer">
  <title>Muhammad Rashid — Footer</title>

  <defs>
    <linearGradient id="mrf-bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#08090C"/>
      <stop offset="40%"  stop-color="#111116"/>
      <stop offset="100%" stop-color="#08090C"/>
    </linearGradient>
    <linearGradient id="mrf-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#FF5A1F" stop-opacity="0"/>
      <stop offset="30%"  stop-color="#FF5A1F" stop-opacity="0.8"/>
      <stop offset="70%"  stop-color="#C5222A" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#C5222A" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="mrf-text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#F5EDE8" stop-opacity="0.5"/>
      <stop offset="50%"  stop-color="#FF9B54" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#F5EDE8" stop-opacity="0.5"/>
    </linearGradient>
    <filter id="mrf-glow" x="-10%" y="-100%" width="120%" height="300%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="mrf-clip">
      <rect width="900" height="80" rx="8"/>
    </clipPath>
  </defs>

  <g clip-path="url(#mrf-clip)">
    <!-- Background -->
    <rect width="900" height="80" fill="url(#mrf-bg)"/>

    <!-- Top accent line -->
    <rect x="0" y="0" width="900" height="1.5" fill="url(#mrf-line)"/>

    <!-- Circuit traces -->
    <path d="M0,40 H80 V30 H180 V40 H320 V35 H450 V40 H580 V30 H720 V40 H840 V32 H900"
          fill="none" stroke="#350A12" stroke-width="1.2" opacity="0.6"
          stroke-dasharray="1100" stroke-dashoffset="1100">
      <animate attributeName="stroke-dashoffset" values="1100;0;1100" dur="8s" repeatCount="indefinite"/>
    </path>

    <!-- Dots on circuit -->
    <g fill="#C5222A" opacity="0.5">
      <circle cx="80"  cy="40" r="2"/>
      <circle cx="180" cy="30" r="2"/>
      <circle cx="320" cy="40" r="2"/>
      <circle cx="450" cy="35" r="2"/>
      <circle cx="580" cy="40" r="2"/>
      <circle cx="720" cy="30" r="2"/>
      <circle cx="840" cy="40" r="2"/>
    </g>

    <!-- Center text -->
    <text x="450" y="46"
          font-family="'Segoe UI', 'Inter', 'Arial', sans-serif"
          font-size="11" font-weight="400" letter-spacing="2.5"
          fill="url(#mrf-text-grad)" text-anchor="middle"
          filter="url(#mrf-glow)">
      BUILT WITH PRECISION  ·  OPEN TO OPPORTUNITIES
    </text>

    <!-- Bottom ember line -->
    <rect x="0" y="77" width="900" height="3" fill="url(#mrf-line)" opacity="0.6"/>

    <!-- Left crimson bar -->
    <rect x="0" y="0" width="3" height="80" fill="#C5222A" opacity="0.6"/>

    <!-- Right crimson bar -->
    <rect x="897" y="0" width="3" height="80" fill="#C5222A" opacity="0.6"/>
  </g>
</svg>
