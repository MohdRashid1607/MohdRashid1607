<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 120" width="900" height="120" role="img" aria-label="Rashid footer">
  <title>Muhammad Rashid</title>
  <defs>
    <linearGradient id="mrf-bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#08090C"/><stop offset="50%" stop-color="#111116"/><stop offset="100%" stop-color="#08090C"/>
    </linearGradient>
    <linearGradient id="mrf-ng" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C5222A" stop-opacity="0.75"/><stop offset="50%" stop-color="#FF5A1F"/><stop offset="100%" stop-color="#C5222A" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="mrf-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5A1F" stop-opacity="0"/><stop offset="35%" stop-color="#FF5A1F" stop-opacity="0.8"/><stop offset="65%" stop-color="#C5222A" stop-opacity="0.8"/><stop offset="100%" stop-color="#C5222A" stop-opacity="0"/>
    </linearGradient>
    <filter id="mrf-glow" x="-25%" y="-80%" width="150%" height="260%">
      <feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="mrf-clip"><rect width="900" height="120" rx="8"/></clipPath>
  </defs>
  <g clip-path="url(#mrf-clip)">
    <rect width="900" height="120" fill="url(#mrf-bg)"/>
    <!-- Top line -->
    <rect x="0" y="0" width="900" height="1.5" fill="url(#mrf-line)"/>
    <!-- Circuit trace loop -->
    <path d="M0,62 H100 V52 H200 V62 H360 V47 H510 V62 H660 V52 H790 V60 H900" fill="none" stroke="#350A12" stroke-width="1.2" opacity="0.65" stroke-dasharray="1100">
      <animate attributeName="stroke-dashoffset" values="0;1100;0" dur="10s" repeatCount="indefinite"/>
    </path>
    <g fill="#C5222A" opacity="0.45">
      <circle cx="100" cy="62" r="2"/><circle cx="200" cy="52" r="2"/><circle cx="360" cy="62" r="2"/>
      <circle cx="510" cy="47" r="2"/><circle cx="660" cy="62" r="2"/><circle cx="790" cy="52" r="2"/>
    </g>
    <!-- Name -->
    <text x="450" y="76" font-family="'Segoe UI','Arial Black','Arial',sans-serif" font-size="48" font-weight="900" letter-spacing="14" fill="url(#mrf-ng)" filter="url(#mrf-glow)" text-anchor="middle">
      RASHID<animate attributeName="opacity" values="0.72;1;0.72" dur="3.5s" repeatCount="indefinite"/>
    </text>
    <!-- Tagline below -->
    <text x="450" y="100" font-family="'Segoe UI','Arial',sans-serif" font-size="9.5" font-weight="400" letter-spacing="3" fill="#FF9B54" opacity="0.5" text-anchor="middle">BUILT WITH PRECISION  ·  OPEN TO OPPORTUNITIES</text>
    <!-- Bottom line -->
    <rect x="0" y="117" width="900" height="3" fill="url(#mrf-line)" opacity="0.6"/>
    <!-- Side bars -->
    <rect x="0" y="0" width="3" height="120" fill="#C5222A" opacity="0.65"/>
    <rect x="897" y="0" width="3" height="120" fill="#C5222A" opacity="0.65"/>
  </g>
</svg>
