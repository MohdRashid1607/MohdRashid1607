<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 696" width="1200" height="696" role="img" aria-labelledby="skl-title skl-desc">
<title id="skl-title">Skills</title>
<desc id="skl-desc">Languages: JavaScript (ES6+), TypeScript, Python, SQL, HTML5, CSS3, Java (introductory), C# (Unity); Frontend: Responsive design, Tailwind CSS, Chart.js, p5.js, Processing; Backend and auth: Node.js, Express.js, REST APIs, JWT, OAuth 2.0, Passport.js, Firebase Authentication, bcrypt, Flask; Databases: MongoDB, MongoDB Atlas, MySQL, SQLite; AI and data: Machine learning, scikit-learn, AI agents, Prompt engineering, Gradio, Streamlit, Hugging Face, Google Dialogflow, MediaPipe; Tools and design: Git, GitHub, Postman, VS Code, Docker, pytest, Vercel, Cloudinary, Figma, Canva, Arduino.</desc>
<defs>
  <linearGradient id="skl-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B0605"/><stop offset="0.55" stop-color="#160A06"/><stop offset="1" stop-color="#3A1209"/></linearGradient>
  <radialGradient id="skl-ga" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#E8491D" stop-opacity="0.50"/><stop offset="1" stop-color="#E8491D" stop-opacity="0"/></radialGradient>
  <radialGradient id="skl-gb" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#FF6B2C" stop-opacity="0.26"/><stop offset="1" stop-color="#FF6B2C" stop-opacity="0"/></radialGradient>
