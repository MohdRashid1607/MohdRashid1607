  <radialGradient id="skl-fade" cx="0.5" cy="0.5" r="0.75"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/></radialGradient>
  <mask id="skl-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="1200" height="696"><rect width="1200" height="696" fill="url(#skl-fade)"/></mask>
