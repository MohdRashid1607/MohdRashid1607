<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" width="600" height="220" role="img" aria-labelledby="pi-title pi-desc">
<title id="pi-title">Multi-Tool AI Agent: Routes between weather and currency tools with a safe allow-list and 16 tests.</title>
<desc id="pi-desc">Built with Python, Google Gemini, Flask, Docker, pytest.</desc>
<defs>
  <linearGradient id="pi-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B0605"/><stop offset="0.55" stop-color="#160A06"/><stop offset="1" stop-color="#3A1209"/></linearGradient>
  <radialGradient id="pi-ga" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#E8491D" stop-opacity="0.50"/><stop offset="1" stop-color="#E8491D" stop-opacity="0"/></radialGradient>
  <radialGradient id="pi-gb" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#FF6B2C" stop-opacity="0.26"/><stop offset="1" stop-color="#FF6B2C" stop-opacity="0"/></radialGradient>
  <linearGradient id="pi-line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#E8491D" stop-opacity="0"/><stop offset="0.5" stop-color="#FFA86B"/><stop offset="1" stop-color="#E8491D" stop-opacity="0"/></linearGradient>
  <linearGradient id="pi-sweep" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFF1E8" stop-opacity="0"/><stop offset="0.5" stop-color="#FFF1E8" stop-opacity="0.95"/><stop offset="1" stop-color="#FFF1E8" stop-opacity="0"/></linearGradient>
  <linearGradient id="pi-tx" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF1E8"/><stop offset="1" stop-color="#FFA86B"/></linearGradient>
  <linearGradient id="pi-num" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFA86B"/><stop offset="1" stop-color="#FF6B2C"/></linearGradient>
  <radialGradient id="pi-fade" cx="0.5" cy="0.5" r="0.75"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/></radialGradient>
  <mask id="pi-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="600" height="220"><rect width="600" height="220" fill="url(#pi-fade)"/></mask>
  <pattern id="pi-grid" width="100" height="100" patternUnits="userSpaceOnUse"><path d="M20 0V100M40 0V100M60 0V100M80 0V100M0 20H100M0 40H100M0 60H100M0 80H100" stroke="#FFA86B" stroke-opacity="0.06" fill="none"/><path d="M0 0H100M0 0V100" stroke="#FFA86B" stroke-opacity="0.15" fill="none"/></pattern>
  <filter id="pi-glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="4" result="pi-blur"/><feMerge><feMergeNode in="pi-blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="pi-clip"><rect width="600" height="220" rx="18"/></clipPath>
  <clipPath id="pi-lineclip"><rect x="0" y="216" width="600" height="4"/></clipPath>
</defs>
<style>
  .serif { font-family: Georgia, 'Times New Roman', 'Liberation Serif', serif; }
  .sans { font-family: 'Segoe UI', Helvetica, Arial, 'Liberation Sans', sans-serif; }
  .da { animation: da 16s ease-in-out infinite alternate; }
  .db { animation: db 21s ease-in-out infinite alternate; }
  @keyframes da { from { transform: translate(0, 0); } to { transform: translate(132px, 60px); } }
  @keyframes db { from { transform: translate(0, 0); } to { transform: translate(-132px, -60px); } }
  .gm { animation: gm 26s linear infinite; }
  @keyframes gm { to { transform: translateX(100px); } }
  .pulse { animation: pulse 3.6s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
  .sweep { animation: sweep 7s ease-in-out infinite; }
  @keyframes sweep { from { transform: translateX(-260px); } to { transform: translateX(660px); } }
  .spin-r { animation: spin 60s linear infinite; }
  .spin-l { animation: spin 40s linear infinite reverse; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .rise { animation: rise 1.2s cubic-bezier(0.2, 0.7, 0.2, 1) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<g clip-path="url(#pi-clip)">
<rect width="600" height="220" fill="url(#pi-bg)"/>
<circle class="da" cx="90" cy="44" r="270" fill="url(#pi-ga)"/>
<circle class="db" cx="510" cy="198" r="270" fill="url(#pi-gb)"/>
<g mask="url(#pi-mask)"><rect class="gm" x="-100" y="0" width="800" height="220" fill="url(#pi-grid)"/></g>
<text class="serif" x="34" y="78" font-size="36" font-weight="700" fill="url(#pi-tx)">Multi-Tool AI Agent</text><text class="sans" font-size="22" fill="#FFF1E8" fill-opacity="0.92"><tspan x="34" y="116">Routes between weather and currency tools</tspan><tspan x="34" y="144">with a safe allow-list and 16 tests.</tspan></text><text class="sans" font-size="19" fill="#FF6B2C"><tspan x="34" y="194">Python, Google Gemini, Flask, Docker, pytest</tspan></text><rect x="437" y="18" width="135" height="30" rx="15" fill="#E8491D" fill-opacity="0.22" stroke="#FF6B2C" stroke-opacity="0.85" stroke-width="1.2"/><text class="sans" x="504.5" y="39" font-size="17" text-anchor="middle" fill="#FFF1E8">GitHub repo</text><rect class="pulse" x="0" y="26" width="5" height="168" rx="2.5" fill="#FF6B2C" style="animation-delay:1.2000000000000002s"/>
<rect class="pulse" x="0" y="217" width="600" height="3" fill="url(#pi-line)"/>
<g clip-path="url(#pi-lineclip)"><rect class="sweep" x="0" y="216" width="200" height="4" fill="url(#pi-sweep)" style="animation-delay:3.3000000000000003s"/></g>
<rect x="1" y="1" width="598" height="218" rx="17" fill="none" stroke="#7C2A10" stroke-opacity="0.85" stroke-width="1.5"/>
</g>
</svg>
