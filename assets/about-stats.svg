<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150" width="1200" height="150" role="img" aria-labelledby="stp-title stp-desc">
<title id="stp-title">Highlights: 4+ years of hands-on experience, 3.8/4.0 GPA with First-Class Honours, 3 end-to-end ML/AI internship projects, 40% rise in customer inquiries at Prime Marketing.</title>
<desc id="stp-desc">Key facts from my resume.</desc>
<defs>
  <linearGradient id="stp-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B0605"/><stop offset="0.55" stop-color="#160A06"/><stop offset="1" stop-color="#3A1209"/></linearGradient>
  <radialGradient id="stp-ga" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#E8491D" stop-opacity="0.50"/><stop offset="1" stop-color="#E8491D" stop-opacity="0"/></radialGradient>
  <radialGradient id="stp-gb" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#FF6B2C" stop-opacity="0.26"/><stop offset="1" stop-color="#FF6B2C" stop-opacity="0"/></radialGradient>
  <linearGradient id="stp-line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#E8491D" stop-opacity="0"/><stop offset="0.5" stop-color="#FFA86B"/><stop offset="1" stop-color="#E8491D" stop-opacity="0"/></linearGradient>
  <linearGradient id="stp-sweep" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFF1E8" stop-opacity="0"/><stop offset="0.5" stop-color="#FFF1E8" stop-opacity="0.95"/><stop offset="1" stop-color="#FFF1E8" stop-opacity="0"/></linearGradient>
  <linearGradient id="stp-tx" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF1E8"/><stop offset="1" stop-color="#FFA86B"/></linearGradient>
  <linearGradient id="stp-num" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFA86B"/><stop offset="1" stop-color="#FF6B2C"/></linearGradient>
  <radialGradient id="stp-fade" cx="0.5" cy="0.5" r="0.75"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/></radialGradient>
  <mask id="stp-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="1200" height="150"><rect width="1200" height="150" fill="url(#stp-fade)"/></mask>
  <pattern id="stp-grid" width="100" height="100" patternUnits="userSpaceOnUse"><path d="M20 0V100M40 0V100M60 0V100M80 0V100M0 20H100M0 40H100M0 60H100M0 80H100" stroke="#FFA86B" stroke-opacity="0.06" fill="none"/><path d="M0 0H100M0 0V100" stroke="#FFA86B" stroke-opacity="0.15" fill="none"/></pattern>
  <filter id="stp-glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="4" result="stp-blur"/><feMerge><feMergeNode in="stp-blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="stp-clip"><rect width="1200" height="150" rx="22"/></clipPath>
  <clipPath id="stp-lineclip"><rect x="0" y="146" width="1200" height="4"/></clipPath>
</defs>
<style>
  .serif { font-family: Georgia, 'Times New Roman', 'Liberation Serif', serif; }
  .sans { font-family: 'Segoe UI', Helvetica, Arial, 'Liberation Sans', sans-serif; }
  .da { animation: da 16s ease-in-out infinite alternate; }
  .db { animation: db 21s ease-in-out infinite alternate; }
  @keyframes da { from { transform: translate(0, 0); } to { transform: translate(264px, 45px); } }
  @keyframes db { from { transform: translate(0, 0); } to { transform: translate(-264px, -45px); } }
  .gm { animation: gm 26s linear infinite; }
  @keyframes gm { to { transform: translateX(100px); } }
  .pulse { animation: pulse 3.6s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
  .sweep { animation: sweep 7s ease-in-out infinite; }
  @keyframes sweep { from { transform: translateX(-260px); } to { transform: translateX(1260px); } }
  .spin-r { animation: spin 60s linear infinite; }
  .spin-l { animation: spin 40s linear infinite reverse; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .rise { animation: rise 1.2s cubic-bezier(0.2, 0.7, 0.2, 1) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<g clip-path="url(#stp-clip)">
<rect width="1200" height="150" fill="url(#stp-bg)"/>
<circle class="da" cx="180" cy="30" r="540" fill="url(#stp-ga)"/>
<circle class="db" cx="1020" cy="135" r="540" fill="url(#stp-gb)"/>
<g mask="url(#stp-mask)"><rect class="gm" x="-100" y="0" width="1400" height="150" fill="url(#stp-grid)"/></g>
<text class="sans" x="44" y="72" font-size="48" font-weight="700" fill="url(#stp-num)">4+</text><text class="sans" font-size="19" fill="#FFF1E8" fill-opacity="0.9"><tspan x="44" y="100">years of hands-on</tspan><tspan x="44" y="124">experience</tspan></text><rect x="300" y="30" width="1" height="90" fill="#7C2A10" fill-opacity="0.9"/><text class="sans" x="344" y="72" font-size="48" font-weight="700" fill="url(#stp-num)">3.8/4.0</text><text class="sans" font-size="19" fill="#FFF1E8" fill-opacity="0.9"><tspan x="344" y="100">GPA, First-Class</tspan><tspan x="344" y="124">Honours</tspan></text><rect x="600" y="30" width="1" height="90" fill="#7C2A10" fill-opacity="0.9"/><text class="sans" x="644" y="72" font-size="48" font-weight="700" fill="url(#stp-num)">3</text><text class="sans" font-size="19" fill="#FFF1E8" fill-opacity="0.9"><tspan x="644" y="100">end-to-end ML/AI</tspan><tspan x="644" y="124">internship projects</tspan></text><rect x="900" y="30" width="1" height="90" fill="#7C2A10" fill-opacity="0.9"/><text class="sans" x="944" y="72" font-size="48" font-weight="700" fill="url(#stp-num)">40%</text><text class="sans" font-size="19" fill="#FFF1E8" fill-opacity="0.9"><tspan x="944" y="100">rise in inquiries at</tspan><tspan x="944" y="124">Prime Marketing</tspan></text>
<rect class="pulse" x="0" y="147" width="1200" height="3" fill="url(#stp-line)"/>
<g clip-path="url(#stp-lineclip)"><rect class="sweep" x="0" y="146" width="200" height="4" fill="url(#stp-sweep)" style="animation-delay:1s"/></g>
<rect x="1" y="1" width="1198" height="148" rx="21" fill="none" stroke="#7C2A10" stroke-opacity="0.85" stroke-width="1.5"/>
</g>
</svg>
