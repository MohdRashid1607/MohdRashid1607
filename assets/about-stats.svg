<rect x="20" y="20" width="275" height="176" rx="16" fill="#3A1209" fill-opacity="0.5" stroke="#7C2A10" stroke-opacity="0.95" stroke-width="1.3"/><text class="sans" x="44" y="92" font-size="54" font-weight="700" fill="url(#abs-num)">3+</text><text class="sans" font-size="20" fill="#FFF1E8" fill-opacity="0.92"><tspan x="44" y="128">years of hands-on</tspan><tspan x="44" y="153">experience</tspan></text><rect x="315" y="20" width="275" height="176" rx="16" fill="#3A1209" fill-opacity="0.5" stroke="#7C2A10" stroke-opacity="0.95" stroke-width="1.3"/><text class="sans" x="339" y="92" font-size="54" font-weight="700" fill="url(#abs-num)">3.8/4.0</text><text class="sans" font-size="20" fill="#FFF1E8" fill-opacity="0.92"><tspan x="339" y="128">GPA, First-Class</tspan><tspan x="339" y="153">Honours</tspan></text><rect x="610" y="20" width="275" height="176" rx="16" fill="#3A1209" fill-opacity="0.5" stroke="#7C2A10" stroke-opacity="0.95" stroke-width="1.3"/><text class="sans" x="634" y="92" font-size="54" font-weight="700" fill="url(#abs-num)">3</text><text class="sans" font-size="20" fill="#FFF1E8" fill-opacity="0.92"><tspan x="634" y="128">end-to-end ML/AI</tspan><tspan x="634" y="153">internship projects</tspan></text><rect x="905" y="20" width="275" height="176" rx="16" fill="#3A1209" fill-opacity="0.5" stroke="#7C2A10" stroke-opacity="0.95" stroke-width="1.3"/><text class="sans" x="929" y="92" font-size="54" font-weight="700" fill="url(#abs-num)">40%</text><text class="sans" font-size="20" fill="#FFF1E8" fill-opacity="0.92"><tspan x="929" y="128">rise in customer</tspan><tspan x="929" y="153">inquiries (Prime</tspan><tspan x="929" y="178">Marketing)</tspan></text><rect x="220" y="222" width="760" height="56" rx="28" fill="#E8491D" fill-opacity="0.16" stroke="#FF6B2C" stroke-opacity="0.8" stroke-width="1.3"/><circle class="pulse" cx="256" cy="250" r="7" fill="#FF6B2C" filter="url(#abs-glow)"/><text class="sans" x="280" y="258" font-size="25" fill="#FFF1E8">Open to full-time, on-site Full-Stack Developer roles</text>
<rect class="pulse" x="0" y="297" width="1200" height="3" fill="url(#abs-line)"/>
<g clip-path="url(#abs-lineclip)"><rect class="sweep" x="0" y="296" width="200" height="4" fill="url(#abs-sweep)" style="animation-delay:1s"/></g>
