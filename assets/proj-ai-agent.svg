<text x="28" y="103" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#F5EDE8" opacity="0.6">Multi-tool AI agent: secure orchestration with prompt-injection defences and a testing suite.</text>
<!-- Built line -->
<text x="28" y="124" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#FF5A1F" opacity="0.75">BUILT  ›  Gemini API tool-calling + multi-agent orchestration, GitHub Codespaces, Python</text>
