<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 195" width="860" height="195" role="img" aria-label="AI Orchestration Agent project card">
<title>AI Orchestration Agent — Project Card</title>
<defs>
<linearGradient id="pc1-bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#111116"/><stop offset="100%" stop-color="#08090C"/></linearGradient>
<linearGradient id="pc1-name" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#F5EDE8"/><stop offset="100%" stop-color="#F5EDE8"/></linearGradient>
<clipPath id="pc1-clip"><rect width="860" height="195" rx="10"/></clipPath>
</defs>
<g clip-path="url(#pc1-clip)">
<rect width="860" height="195" fill="url(#pc1-bg)" stroke="#350A12" stroke-width="1"/>
