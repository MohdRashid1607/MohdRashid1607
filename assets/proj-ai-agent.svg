  <rect x="28"  y="178" width="56"  height="16" rx="8" fill="#1A0508" stroke="#C5222A" stroke-width="0.7"/><text x="56"  y="190" fill="#FF9B54" text-anchor="middle">Python</text>
  <rect x="90"  y="178" width="58"  height="16" rx="8" fill="#1A0508" stroke="#C5222A" stroke-width="0.7"/><text x="119" y="190" fill="#FF9B54" text-anchor="middle">Gemini API</text>
  <rect x="154" y="178" width="46"  height="16" rx="8" fill="#1A0508" stroke="#C5222A" stroke-width="0.7"/><text x="177" y="190" fill="#FF9B54" text-anchor="middle">LLM agents</text>
  <rect x="206" y="178" width="74"  height="16" rx="8" fill="#1A0508" stroke="#C5222A" stroke-width="0.7"/><text x="243" y="190" fill="#FF9B54" text-anchor="middle">Codespaces</text>
</g>
<!-- Right visual — terminal mockup -->
<rect x="592" y="20" width="248" height="158" rx="8" fill="#08090C" stroke="#350A12" stroke-width="0.8"/>
<circle cx="606" cy="33" r="4" fill="#C5222A" opacity="0.8"/><circle cx="620" cy="33" r="4" fill="#FF5A1F" opacity="0.5"/><circle cx="634" cy="33" r="4" fill="#FF9B54" opacity="0.4"/>
<text x="600" y="56"  font-family="'Courier New',monospace" font-size="10" fill="#FF5A1F" opacity="0.8">$ agent.run(task)</text>
<text x="600" y="74"  font-family="'Courier New',monospace" font-size="9"  fill="#FF9B54" opacity="0.6">  [tool] web_search → ok</text>
<text x="600" y="90"  font-family="'Courier New',monospace" font-size="9"  fill="#FF9B54" opacity="0.6">  [tool] code_exec  → ok</text>
<text x="600" y="106" font-family="'Courier New',monospace" font-size="9"  fill="#FF9B54" opacity="0.6">  [guard] injection → blocked</text>
<text x="600" y="122" font-family="'Courier New',monospace" font-size="9"  fill="#FF5A1F" opacity="0.5">  [test] suite → 14/14 pass</text>
<text x="600" y="140" font-family="'Courier New',monospace" font-size="10" fill="#F5EDE8" opacity="0.9">✓ Task complete</text>
<rect x="600" y="148" width="220" height="1" fill="#350A12" opacity="0.6"/>
<text x="600" y="165" font-family="'Courier New',monospace" font-size="9" fill="#C5222A" opacity="0.6">Q · orchestrate tools securely?</text>
<text x="600" y="178" font-family="'Courier New',monospace" font-size="9" fill="#FF9B54" opacity="0.5">A · Gemini API + injection guards</text>
