<text x="28"  y="156" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#F5EDE8">Secure</text>
<text x="28"  y="170" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#F5EDE8" opacity="0.5">prompt-injection defences</text>
<text x="130" y="156" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#F5EDE8">Multi-tool</text>
<text x="130" y="170" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#F5EDE8" opacity="0.5">agentic orchestration</text>
<text x="260" y="156" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#F5EDE8">Tested</text>
<text x="260" y="170" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#F5EDE8" opacity="0.5">full test suite included</text>
<!-- Tags -->
