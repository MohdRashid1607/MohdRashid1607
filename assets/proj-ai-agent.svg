<text x="28" y="28" font-family="'Segoe UI',Arial,sans-serif" font-size="9.5" letter-spacing="2.5" fill="#FF5A1F" opacity="0.7">01  ·  AI  ·  LLM  ·  GEMINI  ·  2026</text>
<!-- Project name -->
<text x="28" y="78" font-family="'Segoe UI','Arial Black',Arial,sans-serif" font-size="42" font-weight="900" fill="url(#pc1-name)">AI Orchestration Agent</text>
