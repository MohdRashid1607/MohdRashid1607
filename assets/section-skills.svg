<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 130" width="1200" height="130" role="img" aria-labelledby="ssk-title ssk-desc">
<title id="ssk-title">Skills</title>
<desc id="ssk-desc">Languages, frameworks and tools I use</desc>
<defs>
  <linearGradient id="ssk-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B0605"/><stop offset="0.55" stop-color="#160A06"/><stop offset="1" stop-color="#3A1209"/></linearGradient>
  <radialGradient id="ssk-ga" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#E8491D" stop-opacity="0.50"/><stop offset="1" stop-color="#E8491D" stop-opacity="0"/></radialGradient>
  <radialGradient id="ssk-gb" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#FF6B2C" stop-opacity="0.26"/><stop offset="1" stop-color="#FF6B2C" stop-opacity="0"/></radialGradient>
  <linearGradient id="ssk-line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#E8491D" stop-opacity="0"/><stop offset="0.5" stop-color="#FFA86B"/><stop offset="1" stop-color="#E8491D" stop-opacity="0"/></linearGradient>
  <linearGradient id="ssk-sweep" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFF1E8" stop-opacity="0"/><stop offset="0.5" stop-color="#FFF1E8" stop-opacity="0.95"/><stop offset="1" stop-color="#FFF1E8" stop-opacity="0"/></linearGradient>
  <linearGradient id="ssk-tx" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF1E8"/><stop offset="1" stop-color="#FFA86B"/></linearGradient>
  <linearGradient id="ssk-num" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFA86B"/><stop offset="1" stop-color="#FF6B2C"/></linearGradient>
  <radialGradient id="ssk-fade" cx="0.5" cy="0.5" r="0.75"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/></radialGradient>
  <mask id="ssk-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="1200" height="130"><rect width="1200" height="130" fill="url(#ssk-fade)"/></mask>
  <pattern id="ssk-grid" width="100" height="100" patternUnits="userSpaceOnUse"><path d="M20 0V100M40 0V100M60 0V100M80 0V100M0 20H100M0 40H100M0 60H100M0 80H100" stroke="#FFA86B" stroke-opacity="0.06" fill="none"/><path d="M0 0H100M0 0V100" stroke="#FFA86B" stroke-opacity="0.15" fill="none"/></pattern>
  <filter id="ssk-glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="4" result="ssk-blur"/><feMerge><feMergeNode in="ssk-blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="ssk-clip"><rect width="1200" height="130" rx="22"/></clipPath>
  <clipPath id="ssk-lineclip"><rect x="0" y="126" width="1200" height="4"/></clipPath>
</defs>
<style>
  .serif { font-family: Georgia, 'Times New Roman', 'Liberation Serif', serif; }
  .sans { font-family: 'Segoe UI', Helvetica, Arial, 'Liberation Sans', sans-serif; }
  .da { animation: da 16s ease-in-out infinite alternate; }
  .db { animation: db 21s ease-in-out infinite alternate; }
  @keyframes da { from { transform: translate(0, 0); } to { transform: translate(264px, 39px); } }
  @keyframes db { from { transform: translate(0, 0); } to { transform: translate(-264px, -39px); } }
  .gm { animation: gm 26s linear infinite; }
  @keyframes gm { to { transform: translateX(100px); } }
  .pulse { animation: pulse 3.6s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
  .sweep { animation: sweep 7s ease-in-out infinite; }
  @keyframes sweep { from { transform: translateX(-260px); } to { transform: translateX(1260px); } }
  .spin-r { animation: spin 60s linear infinite; }
  .spin-l { animation: spin 40s linear infinite reverse; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .rise { animation: rise 1.2s cubic-bezier(0.2, 0.7, 0.2, 1) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<g clip-path="url(#ssk-clip)">
<rect width="1200" height="130" fill="url(#ssk-bg)"/>
<circle class="da" cx="180" cy="26" r="540" fill="url(#ssk-ga)"/>
<circle class="db" cx="1020" cy="117" r="540" fill="url(#ssk-gb)"/>
<g mask="url(#ssk-mask)"><rect class="gm" x="-100" y="0" width="1400" height="130" fill="url(#ssk-grid)"/></g>
<text class="serif rise" x="56" y="70" font-size="50" font-weight="700" fill="url(#ssk-tx)">Skills</text>
<text class="sans rise" x="58" y="106" font-size="21" fill="#FFA86B" style="animation-delay:0.3s">Languages, frameworks and tools I use</text>
<g fill="none">
  <g class="spin-r" style="transform-origin:1060px 65px"><circle cx="1060" cy="65" r="56" stroke="#7C2A10" stroke-width="1.3" stroke-dasharray="3 12"/></g>
  <g class="spin-l" style="transform-origin:1060px 65px;animation-duration:28s"><g transform="rotate(26 1060 65)"><ellipse cx="1060" cy="65" rx="87" ry="28" stroke="#FFA86B" stroke-opacity="0.55" stroke-width="1.3"/><circle cx="1147" cy="65" r="4.6" fill="#FFA86B" filter="url(#ssk-glow)"/></g></g>
  <g class="spin-r" style="transform-origin:1060px 65px;animation-duration:42s"><g transform="rotate(-26 1060 65)"><ellipse cx="1060" cy="65" rx="87" ry="28" stroke="#FF6B2C" stroke-opacity="0.35" stroke-width="1.3"/><circle cx="973" cy="65" r="3.8" fill="#FF6B2C" filter="url(#ssk-glow)"/></g></g>
  <circle cx="1060" cy="65" r="5.4" fill="#FFF1E8" filter="url(#ssk-glow)"/>
</g>
<rect class="pulse" x="0" y="127" width="1200" height="3" fill="url(#ssk-line)"/>
<g clip-path="url(#ssk-lineclip)"><rect class="sweep" x="0" y="126" width="200" height="4" fill="url(#ssk-sweep)" style="animation-delay:3.6s"/></g>
<rect x="1" y="1" width="1198" height="128" rx="21" fill="none" stroke="#7C2A10" stroke-opacity="0.85" stroke-width="1.5"/>
</g>
</svg>
