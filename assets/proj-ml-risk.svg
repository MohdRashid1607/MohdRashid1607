<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 195" width="860" height="195" role="img" aria-label="Machine Failure Risk ML project card">
<title>Machine Failure Risk — Project Card</title>
<defs>
<linearGradient id="pc2-bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#111116"/><stop offset="100%" stop-color="#08090C"/></linearGradient>
<clipPath id="pc2-clip"><rect width="860" height="195" rx="10"/></clipPath>
</defs>
<g clip-path="url(#pc2-clip)">
<rect width="860" height="195" fill="url(#pc2-bg)" stroke="#350A12" stroke-width="1"/>
<rect x="0" y="0" width="3" height="195" fill="#FF5A1F" opacity="0.9"/>
<text x="28" y="28" font-family="'Segoe UI',Arial,sans-serif" font-size="9.5" letter-spacing="2.5" fill="#FF5A1F" opacity="0.7">02  ·  ML  ·  ANOMALY DETECTION  ·  2026</text>
<text x="28" y="78" font-family="'Segoe UI','Arial Black',Arial,sans-serif" font-size="42" font-weight="900" fill="#F5EDE8">Machine Failure Risk</text>
<text x="28" y="103" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#F5EDE8" opacity="0.6">Unsupervised anomaly detection scoring operational risk in lottery draw machines.</text>
<text x="28" y="124" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#FF5A1F" opacity="0.75">BUILT  ›  Isolation Forest · no labelled failure data required · Gradio on Hugging Face Spaces</text>
<line x1="28" y1="136" x2="560" y2="136" stroke="#350A12" stroke-width="1" opacity="0.8"/>
