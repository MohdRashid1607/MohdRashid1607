<!-- Right visual — anomaly scatter -->
<rect x="592" y="20" width="248" height="158" rx="8" fill="#08090C" stroke="#350A12" stroke-width="0.8"/>
<text x="600" y="36" font-family="'Segoe UI',Arial,sans-serif" font-size="9" letter-spacing="2" fill="#FF5A1F" opacity="0.6">ANOMALY  ·  ISOLATION FOREST</text>
