<text x="28"  y="170" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#F5EDE8" opacity="0.5">deployed on Hugging Face</text>
<text x="120" y="156" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#F5EDE8">Unsupervised</text>
<text x="120" y="170" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#F5EDE8" opacity="0.5">no historical labels needed</text>
<text x="268" y="156" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#F5EDE8">Real-time</text>
<text x="268" y="170" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#F5EDE8" opacity="0.5">interactive risk scoring</text>
<g font-family="'Segoe UI',Arial,sans-serif" font-size="10">
  <rect x="28"  y="178" width="56"  height="16" rx="8" fill="#1A0508" stroke="#C5222A" stroke-width="0.7"/><text x="56"  y="190" fill="#FF9B54" text-anchor="middle">Python</text>
  <rect x="90"  y="178" width="80"  height="16" rx="8" fill="#1A0508" stroke="#C5222A" stroke-width="0.7"/><text x="130" y="190" fill="#FF9B54" text-anchor="middle">scikit-learn</text>
  <rect x="176" y="178" width="106" height="16" rx="8" fill="#1A0508" stroke="#C5222A" stroke-width="0.7"/><text x="229" y="190" fill="#FF9B54" text-anchor="middle">Isolation Forest</text>
  <rect x="288" y="178" width="50"  height="16" rx="8" fill="#1A0508" stroke="#C5222A" stroke-width="0.7"/><text x="313" y="190" fill="#FF9B54" text-anchor="middle">Gradio</text>
