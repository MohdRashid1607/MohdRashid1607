<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150" width="1200" height="150" role="img" aria-labelledby="ftr-title">
  <title id="ftr-title">Thanks for stopping by. Muhammad Abdul Rashid</title>

  <defs>
    <linearGradient id="ftr-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3A1209"/>
      <stop offset="0.5" stop-color="#160A06"/>
      <stop offset="1" stop-color="#0B0605"/>
    </linearGradient>
    <linearGradient id="ftr-wave" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0" stop-color="#FF6B2C" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFA86B"/>
      <stop offset="1" stop-color="#FF6B2C" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ftr-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B8391A" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FF6B2C"/>
      <stop offset="1" stop-color="#B8391A" stop-opacity="0"/>
    </linearGradient>
    <filter id="ftr-glow" x="-20%" y="-300%" width="140%" height="700%">
      <feGaussianBlur stdDeviation="4" result="ftr-blur"/>
      <feMerge>
        <feMergeNode in="ftr-blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="ftr-clip"><rect width="1200" height="150" rx="22"/></clipPath>
  </defs>

  <style>
    .ftr-text { font-family: Georgia, 'Times New Roman', 'Liberation Serif', serif; font-size: 26px; font-style: italic; fill: #FFA86B; }
    .ftr-sub  { font-family: 'Segoe UI', Helvetica, Arial, 'Liberation Sans', sans-serif; font-size: 14px; letter-spacing: 1px; fill: #FF6B2C; }
    .ftr-flow { stroke-dasharray: 14 12; animation: ftr-flow 9s linear infinite; }
    @keyframes ftr-flow { to { stroke-dashoffset: -260; } }
    .ftr-pulse { animation: ftr-pulse 3.4s ease-in-out infinite; }
    @keyframes ftr-pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>

  <g clip-path="url(#ftr-clip)">
    <rect width="1200" height="150" fill="url(#ftr-bg)"/>

    <path d="M0 128 C 150 112, 300 144, 450 128 S 750 112, 900 128 S 1050 144, 1200 128" fill="none" stroke="url(#ftr-wave)" stroke-opacity="0.35" stroke-width="1.5"/>
    <path class="ftr-flow" d="M0 128 C 150 112, 300 144, 450 128 S 750 112, 900 128 S 1050 144, 1200 128" fill="none" stroke="url(#ftr-wave)" stroke-width="2.5" stroke-linecap="round"/>

    <text class="ftr-text" x="600" y="62" text-anchor="middle">Thanks for stopping by.</text>
    <text class="ftr-sub" x="600" y="90" text-anchor="middle">Muhammad Abdul Rashid</text>

    <rect class="ftr-pulse" x="420" y="20" width="360" height="2" rx="1" fill="url(#ftr-line)" filter="url(#ftr-glow)"/>
    <rect x="1" y="1" width="1198" height="148" rx="21" fill="none" stroke="#B8391A" stroke-opacity="0.7" stroke-width="1.5"/>
  </g>
</svg>
