<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 696" width="1200" height="696" role="img" aria-labelledby="ach-title ach-desc">
<title id="ach-title">Achievements and medals</title>
<desc id="ach-desc">Featured achievements: First-Class Honours (BSc (Hons) Creative Computing, GPA 3.8/4.0); Certificate of Appreciation (Prime Marketing, for the Prime Arcade campaign (signed by the company CEO)); Ethical Hacking: Session Hijacking (CompTIA-endorsed, CEU 1.00 (LinkedIn Learning)); One Million Prompters Initiative (Launched by H.H. Sheikh Hamdan bin Mohammed, Crown Prince of Dubai); Student Ambassador Award and Academic Excellence Award; Build Intelligent Agents workshop (GDGoC Bath Spa University UAE, Google Agent Development Kit (Nov 2025)). Medals: 800m race, gold, 800m race, silver, 800m race, bronze, Basketball tournament, silver, Cricket tournament, silver, Ajman government marathon.</desc>
<defs>
  <linearGradient id="ach-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B0605"/><stop offset="0.55" stop-color="#160A06"/><stop offset="1" stop-color="#3A1209"/></linearGradient>
