name: Generate contribution snake

on:
  # refresh twice a day
  schedule:
    - cron: "0 */12 * * *"
  # lets you run it by hand from the Actions tab
  workflow_dispatch:
  # also run when you push to the profile repo
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate the snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?color_snake=#FFF1E8&color_dots=#1F1511,#5A2410,#9C3414,#E8491D,#FFA86B
            dist/github-contribution-grid-snake.svg?color_snake=#E8491D&color_dots=#EBEDF0,#FFD2B8,#FFA86B,#FF6B2C,#C4401A

      - name: Publish the SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
